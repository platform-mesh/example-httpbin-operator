name: ci

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write
  id-token: write
  issues: write
  packages: write
  pull-requests: write
  attestations: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: platform-mesh/.github/.github/workflows/job-golang-lint.yml@fdd4eba80b1790501afc7b5289c026fb302d30d0 # main
    with:
      useMake: true

  test:
    uses: platform-mesh/.github/.github/workflows/job-golang-test-source.yml@fdd4eba80b1790501afc7b5289c026fb302d30d0 # main
    secrets: inherit
    with:
      useMake: true
      useLocalCoverageConfig: true

  docker-build:
    if: github.event_name == 'pull_request'
    uses: platform-mesh/.github/.github/workflows/job-docker-build.yml@fdd4eba80b1790501afc7b5289c026fb302d30d0 # main
    with:
      imageTagName: ghcr.io/platform-mesh/example-httpbin-operator
    secrets: inherit

  # job-docker-build* hardcode context "." and the root Dockerfile, so the httpbin
  # image build is inline.
  httpbin-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/platform-mesh/example-httpbin-operator/httpbin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: httpbin
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:pr-${{ github.event.number }}
          cache-from: type=gha,scope=httpbin
          cache-to: type=gha,mode=max,scope=httpbin

  quality-gate:
    if: always()
    permissions: {}
    needs: [lint, test, docker-build, httpbin-build]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "lint failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "test failed"
            exit 1
          fi
          # docker-build is skipped on main pushes — allow skipped
          if [[ "${{ needs.docker-build.result }}" != "success" && "${{ needs.docker-build.result }}" != "skipped" ]]; then
            echo "docker-build failed"
            exit 1
          fi
          # httpbin-build is skipped on main pushes — allow skipped
          if [[ "${{ needs.httpbin-build.result }}" != "success" && "${{ needs.httpbin-build.result }}" != "skipped" ]]; then
            echo "httpbin-build failed"
            exit 1
          fi

  create-version:
    if: github.ref == 'refs/heads/main'
    uses: platform-mesh/.github/.github/workflows/job-create-version.yml@fdd4eba80b1790501afc7b5289c026fb302d30d0 # main
    secrets: inherit

  docker-build-push:
    if: github.ref == 'refs/heads/main'
    needs: [create-version, lint, test]
    uses: platform-mesh/.github/.github/workflows/job-docker-build-push.yml@fdd4eba80b1790501afc7b5289c026fb302d30d0 # main
    with:
      imageTagName: ghcr.io/platform-mesh/example-httpbin-operator
      version: ${{ needs.create-version.outputs.version }}
      multiarch: true
    secrets: inherit

  httpbin-build-push:
    if: github.ref == 'refs/heads/main'
    needs: [create-version, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/platform-mesh/example-httpbin-operator/httpbin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: httpbin
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ needs.create-version.outputs.version }}
          cache-from: type=gha,scope=httpbin
          cache-to: type=gha,mode=max,scope=httpbin
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign container image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  update-version:
    if: github.ref == 'refs/heads/main'
    needs: [create-version, docker-build-push]
    uses: platform-mesh/.github/.github/workflows/job-chart-version-update.yml@fdd4eba80b1790501afc7b5289c026fb302d30d0 # main
    secrets: inherit
    with:
      appVersion: ${{ needs.create-version.outputs.version }}
      chart: example-httpbin-operator

  sbom:
    if: github.ref == 'refs/heads/main'
    needs: [create-version, docker-build-push]
    uses: platform-mesh/.github/.github/workflows/job-sbom.yml@fdd4eba80b1790501afc7b5289c026fb302d30d0 # main
    with:
      imageReference: ghcr.io/platform-mesh/example-httpbin-operator:${{ needs.create-version.outputs.version }}

  image-ocm:
    if: github.ref == 'refs/heads/main'
    needs: [create-version, docker-build-push, sbom]
    uses: platform-mesh/.github/.github/workflows/job-image-ocm.yml@fdd4eba80b1790501afc7b5289c026fb302d30d0 # main
    secrets: inherit
    with:
      imageReference: ghcr.io/platform-mesh/example-httpbin-operator:${{ needs.create-version.outputs.version }}
      appVersion: ${{ needs.create-version.outputs.version }}
      repoName: example-httpbin-operator
      commit: ${{ github.sha }}
      extraResources: |
        - name: httpbin-image
          type: ociImage
          relation: external
          version: "${APP_VERSION}"
          access:
            type: ociArtifact
            imageReference: "ghcr.io/platform-mesh/${REPO_NAME}/httpbin:${APP_VERSION}"
